services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      # Same port inside and out. RELAY_BIND is the host address the port is published on:
      # 127.0.0.1 for a proxy on this host, or the host's LAN / docker bridge address when the
      # proxy runs in a container and forwards to <host address>:8090.
      - "${RELAY_BIND:-127.0.0.1}:8090:8090"
    environment:
      RELAY_INVITE_SECRET: ${RELAY_INVITE_SECRET:-}
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-false}
    volumes:
      - relay-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  relay-data:
