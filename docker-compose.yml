services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      # Bind locally; put Caddy / Cloudflare Tunnel in front for TLS.
      - "127.0.0.1:8090:8080"
    environment:
      RELAY_INVITE_SECRET: ${RELAY_INVITE_SECRET:-}
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-false}
    volumes:
      - relay-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  relay-data:
